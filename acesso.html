    <style>
        /* Variáveis de Cores da Identidade Tennis Place */
        :root {
            --tp-black: #000000;
            --tp-yellow: #FFD100;
            --tp-gray: #333333;
            --bg-color: #F4F4F5;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background-color: var(--white);
            width: 100%;
            max-width: 520px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .login-logo {
            max-width: 180px;
            margin-bottom: 24px;
        }

        .login-title {
            color: var(--tp-black);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #6B7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Container do Seletor de Perfil */
        .login-type-toggle {
            display: flex;
            background: #F1F5F9;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 25px;
            gap: 5px;
        }

        .type-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #64748B;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .type-btn.active {
            background: var(--tp-yellow);
            color: var(--tp-black);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Estilos do Formulário */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--tp-gray);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--tp-black);
            box-shadow: 0 0 0 2px rgba(255, 209, 0, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--tp-black);
            color: var(--tp-yellow);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #222222;
        }

        .error-msg {
            color: #DC2626;
            font-size: 13px;
            font-weight: 600;
            margin-top: 15px;
            min-height: 20px;
        }
    [hidden] { display: none !important; }
        .portal-link { display:block; text-decoration:none; margin:12px 0; }
        .logout-btn { margin-top:16px; background:none; border:0; text-decoration:underline; cursor:pointer; padding:12px; }
        @media(max-width:480px) { .login-card { padding:28px 18px; } .type-btn { font-size:12px; padding:12px 6px; } .input-group input { font-size:16px; } }
    @media(max-width:380px){.login-type-toggle{flex-direction:column;}.type-btn{width:100%;}}
    
        /* Cores e transições por perfil */
        .login-card {
            --profile-bg: #000000;
            --profile-text: #FFD100;
            --profile-hover: #222222;
            --profile-ring: rgba(255,209,0,.3);
        }
        .login-card[data-profile="loja"] {
            --profile-bg: #FFD100;
            --profile-text: #171717;
            --profile-hover: #E8BE00;
            --profile-ring: rgba(255,209,0,.3);
        }
        .login-card[data-profile="franqueado"] {
            --profile-bg: #262626;
            --profile-text: #FFFFFF;
            --profile-hover: #000000;
            --profile-ring: rgba(0,0,0,.2);
        }
        .btn-submit, .type-btn {
            transition: background-color .35s ease, color .35s ease, box-shadow .35s ease;
        }
        .btn-submit, .type-btn.active {
            background-color: var(--profile-bg);
            color: var(--profile-text);
        }
        .btn-submit:hover { background-color: var(--profile-hover); }
        .input-group input:focus {
            border-color: var(--profile-bg);
            box-shadow: 0 0 0 3px var(--profile-ring);
        }
        .type-btn:focus-visible, .btn-submit:focus-visible {
            outline: 3px solid #737373;
            outline-offset: 3px;
        }
        @media (prefers-reduced-motion: reduce) {
            .btn-submit, .type-btn, .input-group input { transition: none; }
        }

    </style>
