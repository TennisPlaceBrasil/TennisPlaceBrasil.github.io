<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tepê, o mascote da Tennis Place</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #wrap { position: fixed; inset: 0; touch-action: pan-y; cursor: grab; }
  #wrap:active { cursor: grabbing; }
  canvas { display: block; width: 100%; height: 100%; }
  .fallback { font-family: sans-serif; text-align: center; padding: 2rem; color: #555; }
</style>
</head>
<body>
<div id="wrap" role="img" aria-label="Tepê, o mascote da Tennis Place: um tênis laranja simpátepe com olhos grandes, luvas e uma bolinha de tênis">
  <canvas id="c"></canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var wrap = document.getElementById('wrap');
  var canvas = document.getElementById('c');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  try {
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, alpha: true });
    renderer.setPixelRatio(1);
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

    function size() {
      var w = wrap.clientWidth, h = wrap.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      var d = Math.max(10.5, 10.8 / camera.aspect);
      camera.position.set(0, 0.5, d);
      camera.lookAt(0, -0.1, 0);
      camera.updateProjectionMatrix();
    }
    size();
    window.addEventListener('resize', size);

    scene.add(new THREE.HemisphereLight(0xffffff, 0xffd9bf, 0.8));
    var key = new THREE.DirectionalLight(0xffffff, 0.95); key.position.set(4, 6, 7); scene.add(key);
    var fill = new THREE.DirectionalLight(0xffe0cc, 0.4); fill.position.set(-6, 2, 4); scene.add(fill);
    var rim = new THREE.DirectionalLight(0xffffff, 0.55); rim.position.set(0, 4, -6); scene.add(rim);

    function M(c, r, cc) {
      return new THREE.MeshPhysicalMaterial({ color: c, roughness: r, metalness: 0, clearcoat: cc, clearcoatRoughness: 0.25 });
    }
    var ORANGE = M(0xff6b2c, 0.38, 0.8),
        LIGHT  = M(0xff9b66, 0.4, 0.7),
        WHITE  = M(0xf7f2ea, 0.35, 0.7),
        NAVY   = M(0x1b2a41, 0.4, 0.6),
        BALL   = M(0xd7ea3f, 0.7, 0.1),
        PURE   = M(0xffffff, 0.3, 0.5),
        BLUSH  = M(0xff8f6b, 0.6, 0.1);

    var SG = new THREE.SphereGeometry(1, 20, 14);
    var root = new THREE.Group(), ch = new THREE.Group();
    root.add(ch); scene.add(root);

    function S(mat, x, y, z, sx, sy, sz, parent) {
      var m = new THREE.Mesh(SG, mat);
      m.position.set(x, y, z); m.scale.set(sx, sy, sz);
      (parent || ch).add(m); return m;
    }
    function C(mat, r, h, x, y, z, parent) {
      var m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 20), mat);
      m.position.set(x, y, z); (parent || ch).add(m); return m;
    }

    S(ORANGE, 0, 0, 0, 1.75, 1.0, 1.15);
    S(ORANGE, -1.0, 0.4, 0, 0.8, 0.95, 1.0);
    S(LIGHT, 0, 0.95, 0, 0.45, 0.5, 0.6).rotation.z = 0.5;
    S(NAVY, -0.95, 1.3, 0, 0.55, 0.18, 0.5);
    [0.25, 0.5, 0.75].forEach(function (x) {
      var l = C(PURE, 0.06, 0.55, x, 1.0 - x * 0.14 + 0.03, 0);
      l.rotation.x = Math.PI / 2;
    });
    S(WHITE, 0.1, -0.95, 0, 2.05, 0.3, 1.25);

    var cv = document.createElement('canvas'); cv.width = cv.height = 256;
    var g = cv.getContext('2d');
    g.fillStyle = '#1b2a41'; g.beginPath(); g.arc(128, 128, 124, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.font = 'bold 116px sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('TP', 128, 138);
    var badge = new THREE.Mesh(
      new THREE.CircleGeometry(0.34, 40),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true })
    );
    badge.position.set(-0.6, 0.12, 1.09); badge.rotation.y = -0.25; ch.add(badge);

    function eye(x, y, z, ry) {
      var e = new THREE.Group();
      e.position.set(x, y, z); e.rotation.y = ry; ch.add(e);
      S(PURE, 0, 0, 0, 0.3, 0.36, 0.2, e);
      S(NAVY, 0.03, -0.02, 0.1, 0.18, 0.22, 0.12, e);
      S(PURE, 0.08, 0.07, 0.19, 0.06, 0.06, 0.04, e);
      return e;
    }
    var eyeL = eye(0.5, 0.35, 1.0, 0.1), eyeR = eye(1.17, 0.3, 0.84, 0.45);

    var smile = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.05, 12, 32, Math.PI), NAVY);
    smile.position.set(0.82, -0.1, 0.99); smile.rotation.set(0, 0.3, Math.PI); ch.add(smile);
    S(BLUSH, 0.22, -0.12, 1.06, 0.14, 0.09, 0.05);
    S(BLUSH, 1.36, -0.08, 0.78, 0.12, 0.08, 0.05).rotation.y = 0.5;

    var armL = new THREE.Group(); armL.position.set(-1.4, 0.1, 0.6); ch.add(armL);
    C(NAVY, 0.1, 0.8, 0, 0.4, 0, armL);
    S(PURE, 0, 0.9, 0, 0.26, 0.26, 0.26, armL);
    S(PURE, 0.2, 0.98, 0.05, 0.1, 0.1, 0.1, armL);

    var armR = new THREE.Group(); armR.position.set(1.3, -0.1, 0.75); armR.rotation.z = -1.1; ch.add(armR);
    C(NAVY, 0.1, 0.8, 0, 0.4, 0, armR);
    S(PURE, 0, 0.9, 0, 0.26, 0.26, 0.26, armR);
    var ball = new THREE.Group(); ball.position.set(0, 1.38, 0.05); armR.add(ball);
    S(BALL, 0, 0, 0, 0.31, 0.31, 0.31, ball);
    [-0.26, 0.26].forEach(function (x) {
      var t = new THREE.Mesh(new THREE.TorusGeometry(0.172, 0.02, 8, 32), PURE);
      t.position.x = x; t.rotation.y = Math.PI / 2; ball.add(t);
    });

    function leg(x) {
      C(NAVY, 0.09, 0.6, x, -1.45, 0.1);
      C(PURE, 0.14, 0.3, x, -1.4, 0.1);
      S(NAVY, x + 0.12, -1.88, 0.1, 0.38, 0.17, 0.26);
    }
    leg(-0.7); leg(0.9);

    var sc = document.createElement('canvas'); sc.width = sc.height = 128;
    var sg = sc.getContext('2d');
    var gr = sg.createRadialGradient(64, 64, 4, 64, 64, 62);
    gr.addColorStop(0, 'rgba(0,0,0,0.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    sg.fillStyle = gr; sg.fillRect(0, 0, 128, 128);
    var sh = new THREE.Mesh(
      new THREE.PlaneGeometry(6.4, 3.2),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false })
    );
    sh.rotation.x = -Math.PI / 2; sh.position.y = -2.06; root.add(sh);

    var base = -0.45, tilt = 0, drag = false, lx = 0, ly = 0;
    wrap.addEventListener('pointerdown', function (e) {
      drag = true; lx = e.clientX; ly = e.clientY;
      try { wrap.setPointerCapture(e.pointerId); } catch (x) {}
    });
    wrap.addEventListener('pointermove', function (e) {
      if (!drag) return;
      base += (e.clientX - lx) * 0.011;
      tilt = Math.max(-0.35, Math.min(0.35, tilt + (e.clientY - ly) * 0.004));
      lx = e.clientX; ly = e.clientY;
    });
    function up() { drag = false; }
    wrap.addEventListener('pointerup', up);
    wrap.addEventListener('pointercancel', up);

    var t0 = performance.now();
    var visible = true;
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (en) { visible = en[0].isIntersecting;if(visible)queue(); }).observe(wrap);
    }
    var active=false,queued=false,lastFrame=0;
    function queue(){if(!queued){queued=true;requestAnimationFrame(loop);}}
    window.addEventListener('message',function(e){if(e.source!==parent||e.origin!==location.origin)return;active=e.data&&e.data.type==='tepe-active'&&!!e.data.active;queue();});
    document.addEventListener('visibilitychange',queue);
    window.addEventListener('resize',queue);
    wrap.addEventListener('pointermove',queue);
    function loop(now) {
      queued=false;
      if(!visible||document.hidden)return;
      if(active&&!reduceMotion)queue();
      if(active&&now-lastFrame<50)return;lastFrame=now;
      var t = (performance.now() - t0) / 1000;
      if (active && !reduceMotion) {
        ch.position.y = 0.07 * Math.sin(t * 2.2);
        ch.scale.y = 1 + 0.018 * Math.sin(t * 4.4);
        armL.rotation.z = 0.9 + 0.28 * Math.sin(t * 4.2);
        armR.rotation.z = -1.1 + 0.06 * Math.sin(t * 2.2);
        var bl = (t % 3.4) > 3.3 ? 0.1 : 1;
        eyeL.scale.y = bl; eyeR.scale.y = bl;
      }
      root.rotation.y = base + (drag || reduceMotion || !active ? 0 : 0.2 * Math.sin(t * 0.7));
      if (!drag) tilt *= 0.97;
      root.rotation.x = tilt;
      renderer.render(scene, camera);
    }
    queue();
  } catch (err) {
    wrap.innerHTML = '<img src="tepe-fallback.svg" alt="Tepê, mascote da Tennis Place" style="width:100%;height:100%;object-fit:contain">';
  }
})();
</script>
</body>
</html>
